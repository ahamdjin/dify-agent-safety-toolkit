identity:
  name: compact_json
  author: ahamdjin
  label:
    en_US: Prepare Agent JSON
description:
  human:
    en_US: Mask common secret fields and sensitive text values, remove nulls, and cap list/string/depth sizes in API JSON before an agent step. Output is lossy.
  llm: Use to reduce large JSON tool responses before sending them to a model. Masks common secret and personal-data patterns, but this is not complete DLP. Preserve the original separately if needed.
parameters:
  - name: json_text
    type: string
    required: true
    form: llm
    label:
      en_US: JSON input
    human_description:
      en_US: A JSON string (max 120000 characters). Use JSON serialization for objects from upstream nodes.
    llm_description: Serialized JSON response to compact and mask before model use.
  - name: max_string
    type: number
    required: false
    form: form
    default: 1000
    min: 100
    max: 4000
    label:
      en_US: Max characters per string
    human_description:
      en_US: Maximum characters kept in each string value (100-4000); default 1000.
    llm_description: Per-string limit.
  - name: max_items
    type: number
    required: false
    form: form
    default: 25
    min: 1
    max: 100
    label:
      en_US: Max items per array
    human_description:
      en_US: Maximum items kept per array (1-100); default 25.
    llm_description: Array item limit.
  - name: max_depth
    type: number
    required: false
    form: form
    default: 8
    min: 1
    max: 16
    label:
      en_US: Max JSON depth
    human_description:
      en_US: Truncate nested objects/arrays at this depth (1-16); default 8.
    llm_description: Maximum retained nesting.
  - name: allowed_paths
    type: string
    required: false
    form: form
    label:
      en_US: Allowed paths (one per line)
    human_description:
      en_US: Only forward these dot-separated JSON paths. Example lead.id or activities[].type. Leave blank to retain the full JSON and mark it for review.
    llm_description: Newline-separated allowlist of JSON field paths. Arrays use [].
  - name: required_paths
    type: string
    required: false
    form: form
    label:
      en_US: Required paths (one per line)
    human_description:
      en_US: Block if these paths are missing, null, empty, masked, or lost to truncation. Must be covered by the allowlist when used.
    llm_description: Paths that must survive preparation.
  - name: additional_secret_keys
    type: string
    required: false
    form: form
    label:
      en_US: Extra secret field names
    human_description:
      en_US: One JSON key name per line, such as internalCredential. Matching field values are masked at every depth.
    llm_description: Extra sensitive JSON keys to mask in addition to built-in names.
  - name: mask_literals
    type: string
    required: false
    form: form
    label:
      en_US: Extra literal values to mask
    human_description:
      en_US: One exact literal per line, 4-128 characters. Case-sensitive replacements. Avoid storing real API keys here as Dify may log configuration.
    llm_description: Specific literal strings to mask in selected JSON values.
  - name: block_on_truncation
    type: boolean
    required: false
    form: form
    default: false
    label:
      en_US: Block if content is truncated
    human_description:
      en_US: Return no JSON payload if a string, list, or nested object is cut by compaction limits.
    llm_description: Reject lossy results entirely when true.
output_schema:
  type: object
  properties:
    json_text:
      type: string
      description: Serialized compacted JSON to send to the next workflow or LLM node.
    policy_status:
      type: string
      description: Deterministic pass, review or block. Pass does not certify that data is safe.
      enum: [pass, review, block]
    policy_reasons:
      type: array
      items:
        type: string
      description: Machine-readable reasons for review or block, never raw input values.
    missing_required_paths:
      type: array
      items:
        type: string
      description: Configured required paths absent from the prepared result.
    may_auto_continue:
      type: boolean
      description: True only when status is pass. Workflow must explicitly branch on it.
    fields_excluded:
      type: integer
      description: Number of JSON keys excluded by explicit allowlist projection.
    characters_removed:
      type: integer
      description: Max(0, raw input characters minus returned JSON characters), not token savings.
    changed:
      type: boolean
    input_characters:
      type: integer
    output_characters:
      type: integer
    redaction_counts:
      type: object
      description: Counts for pattern redaction and masked fields. No sensitive values.
    compaction:
      type: object
      description: Number of truncated values, removed nulls and masked fields.
  required:
    - json_text
    - changed
    - input_characters
    - output_characters
    - redaction_counts
    - compaction
extra:
  python:
    source: tools/compact_json.py
