identity:
  name: compact_json
  author: ahamdjin
  label:
    en_US: Prepare Agent JSON
description:
  human:
    en_US: Mask common secret fields and sensitive text values, remove nulls, and cap list/string/depth sizes in API JSON before an agent step. Output is lossy.
  llm: Use to reduce large JSON tool responses before sending them to a model. Masks common secret and personal-data patterns, but this is not complete DLP. Preserve the original separately if needed.
parameters:
  - name: json_text
    type: string
    required: true
    form: llm
    label:
      en_US: JSON input
    human_description:
      en_US: A JSON string (max 120000 characters). Use JSON serialization for objects from upstream nodes.
    llm_description: Serialized JSON response to compact and mask before model use.
  - name: max_string
    type: number
    required: false
    form: form
    default: 1000
    min: 100
    max: 4000
    label:
      en_US: Max characters per string
    human_description:
      en_US: Maximum characters kept in each string value (100-4000); default 1000.
    llm_description: Per-string limit.
  - name: max_items
    type: number
    required: false
    form: form
    default: 25
    min: 1
    max: 100
    label:
      en_US: Max items per array
    human_description:
      en_US: Maximum items kept per array (1-100); default 25.
    llm_description: Array item limit.
  - name: max_depth
    type: number
    required: false
    form: form
    default: 8
    min: 1
    max: 16
    label:
      en_US: Max JSON depth
    human_description:
      en_US: Truncate nested objects/arrays at this depth (1-16); default 8.
    llm_description: Maximum retained nesting.
output_schema:
  type: object
  properties:
    json_text:
      type: string
      description: Serialized compacted JSON to send to the next workflow or LLM node.
    changed:
      type: boolean
    input_characters:
      type: integer
    output_characters:
      type: integer
    redaction_counts:
      type: object
      description: Counts for pattern redaction and masked fields. No sensitive values.
    compaction:
      type: object
      description: Number of truncated values, removed nulls and masked fields.
  required:
    - json_text
    - changed
    - input_characters
    - output_characters
    - redaction_counts
    - compaction
extra:
  python:
    source: tools/compact_json.py
