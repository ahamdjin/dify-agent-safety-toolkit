name: Validate Dify Agent Safety Toolkit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12 (Dify runtime)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile runtime modules
        run: python -m compileall -q agent_safety.py main.py provider tools
      - name: Run behavioral and plugin contract tests
        run: python -m unittest discover -s tests -v
      - name: Characterize synthetic CRM, support and webhook payloads
        run: python -m benchmarks.measure
      - name: Verify dependency provenance
        run: |
          python -m pip show ahmad-yar-gpt-tools dify_plugin
          python -c "from gpt_tools.pii_redactor import redact_text; from gpt_tools.tool_output_compactor import compact; print('Dependency imports: OK')"

  package:
    name: Package real Dify installer
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download official Dify CLI v0.6.10 with pinned checksum
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.10/dify-plugin-linux-amd64 \
            -o /tmp/dify-plugin
          echo '0cef74bcae375a4337c2ff7d42e4787717981a795e1c23cf56bb27ec07ec8304  /tmp/dify-plugin' | sha256sum -c -
          chmod +x /tmp/dify-plugin
      - name: Build installable package
        run: |
          /tmp/dify-plugin plugin package . -o agent_safety_toolkit-0.1.0.difypkg
          test -s agent_safety_toolkit-0.1.0.difypkg
          sha256sum agent_safety_toolkit-0.1.0.difypkg
      - name: Verify installer excludes development files and secrets
        run: |
          python - <<'PY'
          import pathlib
          import zipfile
          archive = pathlib.Path("agent_safety_toolkit-0.1.0.difypkg")
          with zipfile.ZipFile(archive) as package:
              paths = [name.lstrip("./") for name in package.namelist()]
          required = {
              "manifest.yaml", "main.py", "agent_safety.py", "requirements.txt",
              "PRIVACY.md", "_assets/icon.svg", "provider/agent_safety_toolkit.py",
              "provider/agent_safety_toolkit.yaml", "tools/redact_text.yaml",
              "tools/redact_text.py", "tools/compact_json.yaml", "tools/compact_json.py",
          }
          missing = required.difference(paths)
          forbidden = [
              name for name in paths
              if name.startswith((".git/", ".github/", "tests/", "benchmarks/", ".venv/", "__pycache__/"))
              or "/__pycache__/" in name
              or name == ".env" or name.startswith(".env.")
              or name.endswith(".pyc")
          ]
          if missing or forbidden:
              raise SystemExit(f"Package missing files: {sorted(missing)}; unwanted paths: {sorted(forbidden)}")
          print(f"Verified Dify package: {len(paths)} files, all required runtime paths present.")
          PY
      - name: Upload installer artifact for Dify
        uses: actions/upload-artifact@v4
        with:
          name: agent-safety-toolkit-dify-package
          path: agent_safety_toolkit-0.1.0.difypkg
          if-no-files-found: error
          retention-days: 30
